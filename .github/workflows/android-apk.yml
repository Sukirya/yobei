name: CI

# Modeled on the reference project's proven CI layout (committed
# src-tauri/gen project, setup-android, sdkmanager package pins),
# adapted to a debug arm64 build. The generated project is committed
# and pinned to API 36: the current Tauri template emits 37, but no
# 'platforms;android-37' package exists in any sdkmanager channel yet
# (stable tops out at 36), and the app uses no API-37-only features.
#
# Artifact: Actions run -> Artifacts -> yobei-android-debug-apk
# (debug-signed, installs on any arm64 Android device).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  # The reference project's CI built but never ran its tests (DESIGN.md
  # section 6) - ours runs the core suite on every push.
  test-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/yobei-core -> target

      - name: Check formatting
        run: cargo fmt --manifest-path crates/yobei-core/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path crates/yobei-core/Cargo.toml --all-targets -- -D warnings

      - name: Run core tests
        # No root workspace manifest by design (Tauri layout); point
        # cargo at the crate directly.
        run: cargo test --manifest-path crates/yobei-core/Cargo.toml

  # Windows is platform priority #2: keep the desktop shell compiling
  # there even before release builds are wired up.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies and build frontend
        run: |
          bun install
          bun run build

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy the Tauri shell
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Frontend type check
        run: bun run check

  worker-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd workers/sync && bun install --frozen-lockfile

      - name: Type-check the sync worker
        run: cd workers/sync && bun run typecheck

  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: bun install

      - name: Build Android debug APK (arm64)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bun run tauri android build --debug --target aarch64 --ci

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v6
        with:
          name: yobei-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # Release APK: R8 + resource shrinking (see app/build.gradle.kts) and the
  # size-focused Rust release profile. Built split per ABI
  # (--split-per-abi: one APK per architecture) instead of a single
  # arm64-only build, so every device gets a matching APK. Signing comes
  # from the ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS /
  # ANDROID_KEY_PASSWORD / ANDROID_STORE_PASSWORD secrets when present;
  # without them the build falls back to the debug keystore, which is only
  # good for measuring size and testing, never for distribution.
  build-android-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: bun install

      - name: Setup Android signing (optional)
        working-directory: src-tauri/gen/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=$ANDROID_STORE_PASSWORD"
            } > keystore.properties
          fi

      - name: Build Android release APKs (split per ABI)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bun run tauri android build --split-per-abi --ci

      - name: Upload Android release APK
        uses: actions/upload-artifact@v6
        with:
          name: yobei-android-release-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # Windows desktop (ADR-0011): tray + extension API. The windows-check
  # job above only compiles the shell; this one produces the installer
  # (NSIS .exe) the user installs on Windows. TAURI_BUNDLE_TARGETS=nsis
  # skips the MSI/WiX path; WebView2 and NSIS are preinstalled on the
  # windows-latest runner image. Unsigned for now (same standing as the
  # debug-keystore Android APKs): fine for personal installs, never ship
  # to others without a code-signing certificate.
  build-windows:
    runs-on: windows-latest
    env:
      TAURI_BUNDLE_TARGETS: nsis
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: bun install

      - name: Build Windows installer
        run: bun run tauri build --ci

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: yobei-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
