name: Android APK (debug)

# Builds an installable arm64 debug APK in the cloud and stores it as a
# workflow artifact (Actions run -> Artifacts -> yobei-android-debug-apk).
# Debug builds are signed with the standard Android debug key, so they
# install on any device with "install via USB / unknown apps" allowed.
# Release signing (your own keystore) is a separate, later step.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu image ships an Android SDK already ($ANDROID_HOME);
      # android-actions/setup-android proved fragile on current images
      # (it dies installing the legacy 'tools' package), so drive
      # sdkmanager directly instead.
      - name: Install SDK platform 37 and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # The current Tauri template targets API 37, but no
          # 'platforms;android-37' package exists in any sdkmanager
          # channel yet (stable tops out at 36). We install API 36
          # and pin the generated project down to it below; the app
          # uses no API-37-only features.
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;27.2.12479018"

      - name: Set up Rust (stable + Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-android-${{ hashFiles('src-tauri/Cargo.lock', 'crates/yobei-core/Cargo.toml') }}
          restore-keys: cargo-android-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Generate Android project
        run: bun run tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Pin generated project to API 36
        run: |
          grep -rlE "(compileSdk|targetSdk) = 37" src-tauri/gen/android --include=build.gradle.kts \
            | xargs sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/'
          grep -rnE "(compileSdk|targetSdk)" src-tauri/gen/android/app/build.gradle.kts

      - name: Build debug APK (arm64)
        run: bun run tauri android build --debug --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yobei-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30
