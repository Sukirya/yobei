name: CI

# Modeled on the reference project's proven CI layout (committed
# src-tauri/gen project, setup-android, sdkmanager package pins),
# adapted to a debug arm64 build. The generated project is committed
# and pinned to API 36: the current Tauri template emits 37, but no
# 'platforms;android-37' package exists in any sdkmanager channel yet
# (stable tops out at 36), and the app uses no API-37-only features.
#
# Artifact: Actions run -> Artifacts -> yobei-android-debug-apk
# (debug-signed, installs on any arm64 Android device).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  # The reference project's CI built but never ran its tests (DESIGN.md
  # section 6) - ours runs the core suite on every push.
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/yobei-core -> target

      - name: Run core tests
        run: cargo test -p yobei-core

  # Windows is platform priority #2: keep the desktop shell compiling
  # there even before release builds are wired up.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies and build frontend
        run: |
          bun install
          bun run build

      - name: Type-check the Tauri shell on Windows
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: bun install

      - name: Build Android debug APK (arm64)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bun run tauri android build --debug --target aarch64 --ci

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yobei-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30
