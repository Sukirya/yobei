[package]
name = "yobei-core"
version = "0.1.0"
edition = "2021"
description = "yobei password manager core: unified record model, key hierarchy parameters, hexagonal ports, sync protocol types. No Tauri or platform dependencies."
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cryptography: audited RustCrypto implementations only (see docs/DESIGN.md §3).
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
zeroize = "1"
# Local storage: SQLite with per-record ciphertext blobs (DESIGN.md §7 ADR).
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
